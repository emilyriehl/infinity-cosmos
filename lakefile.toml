name = "InfinityCosmos"
defaultTargets = ["InfinityCosmos"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
relaxedAutoImplicit = false

#  Fail a module upon warnings:
warningAsError = true

# Do not emit warnings when encountering sorry
# The blueprint tracks this anyways
warn.sorry = false

[[require]]
name = "LeanArchitect"
scope = "hanwenzhu"
rev = "v4.33.0-rc1"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "85e3a25e006c35636f0e53b0e9296caca2685bc0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"

[[lean_lib]]
name = "InfinityCosmos"
